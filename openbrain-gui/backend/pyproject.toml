[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openbrain-gui-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Upper bound is load-bearing, not caution. mcp 2.0.0 is a breaking client
    # release: streamable_http_client yields a 2-tuple where 1.x yields
    # (read, write, get_session_id), and CallToolResult lost `isError`. Both
    # are used by app/mcp_client.py, whose result-parsing helpers are also
    # verified against 1.x internals. An unrelated dependency change once
    # invalidated this image's pip layer and let `mcp>=1.2.0` re-resolve to
    # 2.0.0, which took the live GUI's capture browsing down. Moving to 2.x is
    # a deliberate port; see tests/test_mcp_client.py.
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
