# deploy/docker-compose.openbrain.yml
services:
  openbrain-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: openbrain
    volumes:
      - openbrain_pgdata:/var/lib/postgresql/data
      - ../openbrain-mcp/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks: [openbrain_internal]   # NOT on hermes-agent-7qpk_default — never reachable by Hermes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbrain -d openbrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  openbrain-mcp:
    build: ../openbrain-mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://openbrain:${POSTGRES_PASSWORD}@openbrain-db:5432/openbrain
      OPENBRAIN_TOKEN: ${OPENBRAIN_TOKEN}
      OPENBRAIN_TIMEZONE: ${OPENBRAIN_TIMEZONE:-UTC}
      OPENBRAIN_HOST: ${OPENBRAIN_HOST}
    depends_on:
      openbrain-db:
        condition: service_healthy
    networks:
      - openbrain_internal   # talks to openbrain-db
      - hermes_net           # reachable by Hermes as `openbrain-mcp:8080`
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbrain.rule=Host(`${OPENBRAIN_HOST}`)"
      - "traefik.http.routers.openbrain.entrypoints=websecure"
      - "traefik.http.routers.openbrain.tls.certresolver=letsencrypt"
      - "traefik.http.services.openbrain.loadbalancer.server.port=8080"
      # Explicit low priority so it can never accidentally outrank the
      # /authorize router below for a request that matches both (see that
      # router's comment for why this matters -- Traefik compares priorities
      # numerically regardless of whether they're explicit or automatic, so
      # this MUST stay lower than openbrain-authorize's, not just "unset").
      - "traefik.http.routers.openbrain.priority=1"
      # No Traefik network membership needed: Traefik runs with network_mode: host
      # and already reaches container bridge IPs directly (confirmed in Task 0.3).
      # /authorize is the one browser-facing OAuth step (see openbrain-mcp-oauth-
      # connector-design.md) -- gated by the same basic-auth already protecting
      # the GUI, reusing its middleware and this service (no separate service
      # definition needed). Everything else on this host (/mcp, /token,
      # /register, /.well-known/*) stays reachable without it -- those are
      # machine-to-machine calls from Claude's backend, never a browser.
      #
      # Explicit priority=100 (not just "higher than default"): Traefik's
      # automatic priority for the plain openbrain router above equals that
      # router's rule length in characters (commonly 35-45 for a real
      # hostname) -- an earlier version of this label set priority=10 here,
      # which is LOWER than that automatic value, so the plain Host()-only
      # router silently won every /authorize request and this basic-auth
      # gate was never actually hit. Both routers now set an explicit
      # priority (100 vs. 1 above) so the outcome never depends on rule
      # string length or Traefik's automatic/explicit tie-breaking rules.
      - "traefik.http.routers.openbrain-authorize.rule=Host(`${OPENBRAIN_HOST}`) && Path(`/authorize`)"
      - "traefik.http.routers.openbrain-authorize.entrypoints=websecure"
      - "traefik.http.routers.openbrain-authorize.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openbrain-authorize.priority=100"
      - "traefik.http.routers.openbrain-authorize.middlewares=openbrain-gui-auth"
      - "traefik.http.routers.openbrain-authorize.service=openbrain"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  openbrain-gui:
    build: ../openbrain-gui
    restart: unless-stopped
    environment:
      OPENBRAIN_MCP_URL: http://openbrain-mcp:8080/mcp
      OPENBRAIN_TOKEN: ${OPENBRAIN_TOKEN}
      GUI_DB_PATH: /data/gui.db
    volumes:
      - openbrain_gui_data:/data
      # Hermes' own data dir, READ-ONLY: state.db (token/cost usage) and
      # config.yaml (the cost-relevant knobs). :ro means a GUI bug cannot alter
      # Hermes' state, and it is why reads work from a copy -- SQLite needs to
      # create a -shm beside a WAL database, which this mount forbids.
      # Mounting state.db alone is impossible: its WAL sidecar files are
      # created and destroyed dynamically. See design spec section 4.4.
      - /docker/hermes-agent-7qpk/data:/hermes-data:ro
    depends_on:
      openbrain-mcp:
        condition: service_healthy
    networks:
      - hermes_net   # reaches openbrain-mcp:8080 by container name; NOT on openbrain_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbrain-gui.rule=Host(`${OPENBRAIN_GUI_HOST}`)"
      - "traefik.http.routers.openbrain-gui.entrypoints=websecure"
      - "traefik.http.routers.openbrain-gui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openbrain-gui.middlewares=openbrain-gui-auth"
      - "traefik.http.middlewares.openbrain-gui-auth.basicauth.users=${GUI_BASIC_AUTH_USERS}"
      - "traefik.http.services.openbrain-gui.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  openbrain_pgdata:
  openbrain_gui_data:

networks:
  openbrain_internal:
    driver: bridge
  hermes_net:
    external: true
    name: hermes-agent-7qpk_default
